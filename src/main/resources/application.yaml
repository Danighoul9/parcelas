spring:
  application:
    name: parcelas

  datasource:
    url: jdbc:mariadb://localhost:3306/ejemplo #El puerto cambia dependiendo donde tengas la base de datos alojada
    username: usuario
    password: usuario

  # Esto de sql.init.mode:always es para que la base de datos lea siempre el archivo sql
  # una vez ya esten insertados los datos lo ponemos en never
