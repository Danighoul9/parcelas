   # init:
    #  mode: never
  #Lo comentamos porque primero tiene que crearse la base de datos y luego ya se puede inicializar con los datos,
  #entonces seguiriamos las instrucciones de arriba.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
       format_sql: true

