<!DOCTYPE html>
<!--
  Fragmentos comunes del layout. Uso desde cualquier página:

    <head th:replace="~{fragments/layout :: head('Título de la página')}"></head>
    <nav  th:replace="~{fragments/layout :: navbar}"></nav>
    <aside th:replace="~{fragments/layout :: sidebar('sensores')}"></aside>
    <div  th:replace="~{fragments/layout :: alertas}"></div>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  El parámetro de sidebar(...) marca qué opción del menú aparece activa.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ===================== HEAD ===================== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · AgroMonitor'">AgroMonitor</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}" href="../../static/css/app.css">
</head>

<body>

<!-- ===================== BARRA SUPERIOR ===================== -->
<nav th:fragment="navbar" class="navbar navbar-app sticky-top px-3">
    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                aria-controls="sidebar" aria-label="Abrir menú">
            <i class="bi bi-list"></i>
        </button>
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}" href="#">
            <i class="bi bi-flower1"></i> AgroMonitor
        </a>
    </div>

    <div class="d-flex align-items-center gap-3">
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-body dropdown-toggle"
               data-bs-toggle="dropdown" aria-expanded="false">
                <!-- nombreUsuario y numAlarmas los añade LayoutModelAdvice a todas las vistas -->
                <span class="avatar"
                      th:text="${nombreUsuario != null ? #strings.toUpperCase(#strings.substring(nombreUsuario,0,1)) : 'U'}">U</span>
                <span class="d-none d-sm-inline small"
                      th:text="${nombreUsuario ?: 'Usuario'}">Usuario</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/perfil}" href="#"><i class="bi bi-person me-2"></i>Mi perfil</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <!-- Spring Security: logout por POST con CSRF -->
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===================== MENÚ LATERAL ===================== -->
<!-- offcanvas-lg: en escritorio es una columna fija; en móvil se despliega con el botón ☰ -->
<aside th:fragment="sidebar(activo)" class="sidebar offcanvas-lg offcanvas-start"
       id="sidebar" tabindex="-1" aria-labelledby="sidebarLabel">
    <div class="offcanvas-header border-bottom d-lg-none">
        <h5 class="offcanvas-title" id="sidebarLabel">Menú</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                data-bs-target="#sidebar" aria-label="Cerrar"></button>
    </div>

    <div class="offcanvas-body d-block p-0 pb-3">
        <div class="sidebar-heading">General</div>
        <nav class="nav flex-column">
            <a class="nav-link" th:classappend="${activo == 'dashboard'} ? 'active'" th:href="@{/}" href="#">
                <i class="bi bi-speedometer2"></i> Panel
            </a>
        </nav>

        <div class="sidebar-heading">Explotación</div>
        <nav class="nav flex-column">
            <a class="nav-link" th:classappend="${activo == 'parcelas'} ? 'active'" th:href="@{/parcelas}" href="#">
                <i class="bi bi-grid-3x3-gap"></i> Parcelas
            </a>
            <a class="nav-link" th:classappend="${activo == 'cultivos'} ? 'active'" th:href="@{/cultivos}" href="#">
                <i class="bi bi-flower2"></i> Cultivos
            </a>
        </nav>

        <div class="sidebar-heading">Monitorización</div>
        <nav class="nav flex-column">
            <a class="nav-link" th:classappend="${activo == 'sensores'} ? 'active'" th:href="@{/sensores}" href="#">
                <i class="bi bi-broadcast"></i> Sensores
            </a>
            <a class="nav-link" th:classappend="${activo == 'lecturas'} ? 'active'" th:href="@{/lecturas}" href="#">
                <i class="bi bi-graph-up"></i> Lecturas
            </a>
        </nav>

    </div>
</aside>


<!-- ===================== PIE ===================== -->
<footer th:fragment="footer" class="app-footer d-flex flex-wrap justify-content-between gap-2">
    <span>© <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> AgroMonitor</span>
    <span>Versión 1.0</span>
</footer>

<!-- ===================== SCRIPTS ===================== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
