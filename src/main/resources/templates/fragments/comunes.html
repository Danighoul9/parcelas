<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="tarjeta(titulo, valor, icono, color)" class="col-sm-6 col-xl-3">
    <div class="card tarjeta-indicador h-100">
      <div class="card-body d-flex align-items-center gap-3">
        <div th:class="|fs-2 text-${color}|">
          <i th:class="|bi ${icono}|"></i>
        </div>
        <div>
          <div class="small text-body-secondary" th:text="${titulo}">Indicador</div>
          <div class="fs-4 fw-semibold" th:text="${valor}">0</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
