<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle del sensor')}">
    <title>Detalle del sensor | AgroMonitor</title>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="agro-shell">
    <aside th:replace="~{fragments/layout :: sidebar('sensores')}"></aside>

    <main class="agro-main" id="contenido">
        <div class="agro-contenido">
            <div th:replace="~{fragments/layout :: header-main('Detalle del sensor')}"></div>

            <div class="card" style="max-width: 400px;">
                <div class="card-header text-white">Información del sensor</div>
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <h4 th:text="${sensor.name}" class="card-title text-success mb-0"></h4>
                        <span th:text="${sensor.tipo}"
                              class="badge bg-success text-white"></span>
                    </div>
                    <p class="card-text mb-2">
                        <strong>Modelo:</strong>
                        <span th:text="${sensor.model}"></span>
                    </p>
                    <p class="card-text mb-2">
                        <strong>Unidad:</strong>
                        <span th:text="${sensor.unidadMedida}"></span>
                    </p>
                    <p class="card-text mb-2">
                        <strong>Estado:</strong>
                        <span th:text="${sensor.estado}"></span>
                    </p>
                    <p class="card-text mb-4">
                        <strong>Coordenadas:</strong>
                        (<span th:text="${sensor.latitud}"></span>,
                        <span th:text="${sensor.longitud}"></span>)
                    </p>
                    <a th:href="@{/sensors}" class="btn btn-primary">Volver atrás</a>
                </div>
            </div>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
