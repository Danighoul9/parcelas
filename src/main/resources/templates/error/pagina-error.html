<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="agro-shell">
    <aside th:replace="~{fragments/layout :: sidebar('panel')}"></aside>

    <main class="agro-main" id="contenido">
        <div class="agro-contenido">
            <div class="agro-card p-4">
                <h2 th:text="${codigo}">500</h2>
                <h3 th:text="${titulo}">Recurso no encontrado</h3>
                <p th:text="${mensaje}">La página solicitada no existe.</p>
                <a th:href="@{/}" class="btn btn-agro">Volver a inicio</a>
            </div>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
