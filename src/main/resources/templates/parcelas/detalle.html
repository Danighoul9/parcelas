<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

    <main class="app-main flex-grow-1 p-3 p-lg-4">

        <div class="page-header d-flex flex-wrap justify-content-between align-items-end gap-2">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb"><li class="breadcrumb-item active">Panel</li></ol>
                </nav>
                <h1>Panel general</h1>
            </div>
            <span class="text-secondary small">
        <i class="bi bi-clock me-1"></i>Actualizado:
        <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}">09/11/2026 19:40</span>
      </span>
        </div>

        <div class="row g-3">
            <div class="card" style="max-width: 400px;">

                <!-- Usamos card-header que crea una especie de cabecera,
                bg-success que lo pinta verde
                y text-white pone el texto blanco -->
                <div class="card-header bg-success text-white ">Información de la parcela </div>

                <div class="card-body">
                    <!-- Usamos este div para poner el nombre y el cultivo en la misma línea -->
                    <div class="d-flex align-items-center gap-2 mb-4">

                        <h4 th:text="${parcela.getNombre()}" class="card-title text-success mb-0"></h4>
                        <span th:text="${parcela.getTipoCultivo()}" class="badge text-dark"></span>

                    </div>
                    <p class="card-text">
                        (<span th:text="${parcela.getSuperficie()}"></span>,
                        <span th:text="${parcela.getUbicacion()}"></span>)
                    </p>
                    <a th:href="@{/parcelas}" class="btn btn-primary">Volver atrás</a>
                </div>
            </div>

        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
