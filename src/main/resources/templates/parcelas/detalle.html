<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de parcela')}">
    <title>Detalle de parcela | AgroMonitor</title>
</head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="agro-shell">
    <aside th:replace="~{fragments/layout :: sidebar('parcelas')}"></aside>

    <main class="agro-main" id="contenido">
        <div class="agro-contenido">
            <div th:replace="~{fragments/layout :: header-main('Detalle de parcela')}"></div>

            <div class="card" style="max-width: 400px;">
                <div class="card-header text-white">Información de la parcela</div>
                <div class="card-body">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <h4 th:text="${parcela.nombre}" class="card-title text-success mb-0"></h4>
                        <span th:text="${parcela.tipoCultivo}"
                              class="badge bg-success text-white"></span>
                    </div>
                    <p class="card-text mb-3">
                        <strong>Superficie:</strong>
                        <span th:text="${parcela.superficie}"></span> ha
                    </p>
                    <p class="card-text mb-4">
                        <strong>Ubicación:</strong>
                        <span th:text="${parcela.ubicacion}"></span>
                    </p>
                    <a th:href="@{/parcelas}" class="btn btn-primary">Volver atrás</a>
                </div>
            </div>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
