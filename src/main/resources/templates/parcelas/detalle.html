<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Parcela por id</title>
</head>
<!-- Le ponemos el mismo fondo moradito de la pagina principal -->
<body class="bg-subtle-accent">

<div class="container mt-3">
    <div class="d-flex flex-wrap align-items-center justify-content-center lg:justify-content-start">
        <ul class="nav col-12 lg:col-auto lg:me-auto mb-2 justify-content-center md:mb-0">
            <li><a th:href="@{/parcelas}" class="nav-link px-2 theme-secondary">Parcelas</a></li>
        </ul>
        <!-- Buscador para las parcelas (no funciona) -->
        <form class="col-12 lg:col-auto mb-3 lg:mb-0 lg:me-3" role="search"
              th:action="@{/parcelas}" method="get">
            <input type="search" name="cultivo" class="form-control"
                   placeholder="Tipo de cultivo..." aria-label="Tipo de cultivo">
        </form>
        <div class="text-end">
            <button type="submit" class="btn btn-outline theme-secondary">Buscar</button>
        </div>
    </div>
</div>



<!-- Usamos el py-5 para añadir espacio tanto arriba como abajo -->
<div class="container py-5">
    
    <div class="card" style="max-width: 400px;">

        <!-- Usamos card-header que crea una especie de cabecera,
        bg-success que lo pinta verde
        y text-white pone el texto blanco -->
        <div class="card-header bg-success text-white ">Información de la parcela </div>

        <div class="card-body">
            <!-- Usamos este div para poner el nombre y el cultivo en la misma línea -->
            <div class="d-flex align-items-center gap-2 mb-4">

                <h4 th:text="${parcela.getNombre()}" class="card-title text-success mb-0"></h4>
                <span th:text="${parcela.getTipoCultivo()}" class="badge text-dark"></span>

            </div>
            <p class="card-text">
                (<span th:text="${parcela.getSuperficie()}"></span>,
                 <span th:text="${parcela.getUbicacion()}"></span>)
            </p>
            <a th:href="@{/parcelas}" class="btn-subtle theme-primary">Volver atrás</a>
        </div>
    </div>

</div>


<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
