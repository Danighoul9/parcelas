<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Document</title>
</head>
<body class="bg-subtle-accent"> <!-- Le ponemos el mismo fondo morado de la pagina principal -->

<div class="container mt-3">
    <div class="d-flex flex-wrap align-items-center justify-content-center lg:justify-content-start">
        <ul class="nav col-12 lg:col-auto lg:me-auto mb-2 justify-content-center md:mb-0">
            <li><a th:href="@{/parcelas}" class="nav-link px-2 theme-secondary">Parcelas</a></li>
        </ul>

        <form class="col-12 lg:col-auto mb-3 lg:mb-0 lg:me-3" role="search">
            <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
        </form>
        <div class="text-end">
            <button type="button" class="btn btn-outline theme-secondary">Search</button>
        </div>
    </div>
</div>

<div class="container mt-3">

    <!-- Le ponemos un fondo grisaceo al formulario. -->
    <form style="max-width: 500px; background-color: #808080;"
          class="mx-auto p-4 border rounded"
          th:action="@{/parcelas}" th:object="${parcela}" th:method="post">

        <!-- Campo oculto proporcionado por el profesor -->
        <input type="hidden" th:field="*{id}">
        <!-- Ponemos el texto H2 en negro. -->
        <h2 class="bg-success-subtle mb-4 p-2 rounded fw-bold"
            style="color:black;">Nueva parcela</h2>
        <div class="mb-3 mt-6">
            <label for="nombre" class="form-label">Nombre</label>
            <!-- Hemos añadido form-control-lg para que el input sea mas grande y se vea mejor en todos -->
            <input type="text" class="form-control form-control-lg" id="nombre" th:field="*{nombre}" required>
        </div>
        <div class="mb-3">
            <label for="ubicacion" class="form-label">Ubicación</label>
            <input type="text" class="form-control form-control-lg" id="ubicacion" th:field="*{ubicacion}" required>
        </div>
        <div class="mb-3">
            <label for="superficie" class="form-label">Superficie</label>
            <input type="text" class="form-control form-control-lg" id="superficie" th:field="*{superficie}" required>
        </div>
        <div class="mb-3">
            <label for="tipoCultivo" class="form-label">Tipo de cultivo</label>
            <select class="form-control form-control-lg" id="tipoCultivo" th:field="*{tipoCultivo}">
                <option value="OLIVAR" selected>Olivar</option>
                <option value="ALMENDRO">Almendro</option>
                <option value="VINEDO">Viñedo</option>
                <option value="CITRICOS">Cítricos</option>
                <option value="PISTACHO">Pistacho</option>
                <option value="LECHUGAS">Lechugas</option>
                <option value="TOMATES">Tomates</option>
                <option value="PIMIENTOS">Pimientos</option>
            </select>
        </div>

        <button type="submit" class="btn-subtle theme-success mt-5">Guardar parcela</button>
        <!-- Añadimos botón de volver atrás para más comodidad -->
        <a th:href="@{/parcelas}" class="btn-subtle theme-danger mt-5">Volver atrás</a>
    </form>

</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
