<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Panel')}">
    <title>Panel | AgroMonitor</title>
</head>

<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<div class="agro-shell" >

    <aside th:replace="~{fragments/layout :: sidebar('parcelas')}"></aside>

    <main class="agro-main" id="contenido">
        <div class="agro-contenido">

            <div th:replace="~{fragments/layout :: header-main('Panel de la explotación')}"></div>
            <div th:replace="~{fragments/layout :: mensajes}"></div>

            <div class="row g-4">
                <div class="col-12">
                <div class="py-4">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                        <div class="d-flex align-items-center gap-3">
                            <h1 class="mb-0">Parcelas</h1>
                            <a th:href="@{/parcelas/nueva}" class="btn btn-success" aria-label="Añadir parcela">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                                </svg>
                                Add Parcela
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Parte de filtrado y busquedad igual que en sensores -->
                <div class="card mb-3">
                    <div class="card-body">
                        <form th:action="@{/parcelas}" method="get" class="row g-3 align-items-end">
                            <div class="col-sm-6 col-lg-4">
                                <label for="q" class="form-label">Buscar</label>
                                <input type="text" class="form-control" id="q" name="q" th:value="${q}" placeholder="Nombre de la parcela">
                            </div>
                            <div class="col-sm-4 col-lg-3">
                                <label for="tipo" class="form-label">Tipo</label>
                                <select class="form-control" id="tipo" name="tipo">
                                    <option value="TODOS">Todos</option>
                                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"
                                            th:selected="${t.toString() == tipo}"></option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search me-1"></i>Buscar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <table class="table table-hover align-middle mb-3 table-agro"
                       style="table-layout: fixed;">
                    <colgroup>
                        <col style="width: 16%;">
                        <col style="width: 17%;">
                        <col style="width: 18%;">
                        <col style="width: 10%;">
                        <col style="width: 18%;">
                    </colgroup>

                    <thead class="table-success">
                    <tr>
                        <th>NOMBRE</th>
                        <th>TIPO</th>
                        <th>UBICACIÓN</th>
                        <th>SUPERFICIE</th>
                        <th>ACCIONES</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="parcela : ${parcelas}">
                        <td>
                            <a th:href="@{/parcelas/{id}(id=${parcela.getId()})}"
                               th:text="${parcela.getNombre()}"
                               class="enlace-cultivo fw-semibold text-decoration-none"></a>
                        </td>
                        <td>
                            <span class="badge bg-success text-white" th:text="${parcela.getTipoCultivo()}"></span>
                        </td>
                        <td th:text="${parcela.getUbicacion()}"></td>
                        <td>
                            <span th:text="${parcela.getSuperficie()}"></span> ha
                        </td>
                        <td class="text-center">
                            <a th:href="@{/parcelas/{id}/editar(id=${parcela.id})}">
                                <button class="btn btn-outline-warning btn-sm" aria-label="Editar parcela">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                         fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M12.854.146a.5.5 0 0 1 .707 0l2.293 2.293a.5.5 0 0 1 0 .707l-9.5
                                9.5a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232zM11.207 2.5
                                13.5 4.793 14.5 3.793 12.207 1.5zm1.586 3L10.5 3.207 3.354 10.354l-.5 2 2-.5z"/>
                                    </svg>
                                </button>
                            </a>

                            <!-- Botón de eliminar con modal -->
                            <button type="button" class="btn btn-outline-danger btn-sm" data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                    th:data-url="@{/parcelas/eliminar/{id}(id=${parcela.id})}"
                                    th:data-nombre="${parcela.nombre}" aria-label="Eliminar parcela">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                     fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                                    <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
                                </svg>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot class="table-success">
                    <tr>
                        <td></td>
                        <td></td>
                        <td class="fw-bold text-white">Superficie total:</td>
                        <td class="fw-bold text-white">
                            <span th:text="${superficieTotal}"></span> ha
                        </td>
                        <td></td>
                    </tr>
                    </tfoot>
                </table>
                </div>
            </div>

            <footer th:replace="~{fragments/layout :: footer}"></footer>

        </div>
    </main>

</div>

<!-- Modal de confirmación de eliminación con script proporcionado por el profesor -->
<div th:replace="~{fragments/layout :: modalEliminar}"></div>
<script>
    const modalEliminar = document.getElementById("modalEliminar");

    if (modalEliminar) {
        modalEliminar.addEventListener("show.bs.modal", (evento) => {
            const boton = evento.relatedTarget;

            modalEliminar.querySelector("#modalEliminarForm").action =
                boton.dataset.url;

            modalEliminar.querySelector("#modalEliminarNombre").textContent =
                boton.dataset.nombre;
        });
    }
</script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
